      <text x="65" y="233" fill="#c9d1d9">loves:</text>
      <text x="120" y="233" fill="#ffd2e9">["Systems",</text>
      <text x="120" y="253" fill="#ffd2e9">"UI/UX"],</text>

      <text x="51" y="278" fill="#c9d1d9">};</text>
