<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="combined-title combined-description">
  <title id="combined-title">Animated terminal and developer profile for Aki</title>
  <desc id="combined-description">A two-panel IDE composition. The left terminal preserves Aki's animated ASCII introduction, while the right editor shows a concise TypeScript profile.</desc>

