  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="91" y="324" fill="#c9d1d9" clip-path="url(#left-command-clip)">$ ./INTRODUCE.SH</text>
    <text x="91" y="353" fill="#ffd2e9" clip-path="url(#left-response-clip)">&gt; HI, I'M AKI</text>
