name: Play FlashWordle

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: flashwordle
  cancel-in-progress: false

jobs:
  play:
    if: github.actor != 'github-actions[bot]' && github.event.issue.number == 1

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process guess
        run: node scripts/processGuess.js
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Commit and publish updated board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data README.md

          if git diff --cached --quiet; then
            echo "No board changes to commit."
          else
            git commit -m "game: update FlashWordle board"
            git push
          fi

      - name: Post response after publishing
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const responsePath = ".flashwordle-response.md";

            if (!fs.existsSync(responsePath)) {
              core.info("No response was generated.");
              return;
            }

            const body = fs.readFileSync(
              responsePath,
              "utf8"
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });